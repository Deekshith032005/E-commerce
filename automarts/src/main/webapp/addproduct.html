<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Product | AUTOMART</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css"
rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js">
</script>

<style>

/* ================= GENERAL ================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{

    background:linear-gradient(
        135deg,
        #ffffff,
        #f8f8f8,
        #eeeeee
    );

    min-height:100vh;

    color:#333;

}


/* ================= NAVBAR ================= */

.navbar{

    background:#ffffff;

    box-shadow:
    0 3px 15px
    rgba(0,0,0,0.15);

}

.navbar-brand{

    color:#d60000 !important;

    font-size:26px;

    font-weight:bold;

}

.navbar-brand img{

    margin-right:8px;

}

.navbar-nav .nav-link{

    color:#333 !important;

    font-weight:bold;

    margin-left:15px;

    transition:0.3s;

}

.navbar-nav .nav-link:hover{

    color:#d60000 !important;

}


/* ================= PRODUCT FORM ================= */

.product-container{

    width:90%;

    max-width:650px;

    margin:50px auto;

    background:#ffffff;

    padding:40px;

    border-radius:20px;

    box-shadow:
    0 10px 30px
    rgba(0,0,0,0.15);

}


/* ================= HEADING ================= */

.product-container h1{

    text-align:center;

    color:#d60000;

    font-weight:bold;

    margin-bottom:10px;

}

.product-container .subtitle{

    text-align:center;

    color:#777;

    margin-bottom:30px;

}


/* ================= FORM ================= */

.form-label{

    font-weight:bold;

    color:#333;

    margin-bottom:8px;

}

.form-control{

    border:1px solid #ccc;

    border-radius:8px;

    padding:12px;

    transition:0.3s;

}

.form-control:focus{

    border-color:#d60000;

    box-shadow:
    0 0 0 0.2rem
    rgba(214,0,0,0.15);

}


/* ================= FILE INPUT ================= */

input[type="file"]{

    background:#f8f8f8;

    cursor:pointer;

}


/* ================= ADD BUTTON ================= */

.add-btn{

    width:100%;

    background:#d60000;

    color:white;

    border:none;

    padding:12px;

    border-radius:8px;

    font-size:17px;

    font-weight:bold;

    margin-top:15px;

    transition:0.3s;

}

.add-btn:hover{

    background:#a80000;

    color:white;

    transform:translateY(-2px);

    box-shadow:
    0 5px 15px
    rgba(214,0,0,0.25);

}


/* ================= FOOTER ================= */

.footer{

    background:#111;

    color:white;

    text-align:center;

    padding:20px;

    margin-top:60px;

}

.footer h5{

    color:#d60000;

    font-weight:bold;

}

.footer p{

    color:#cccccc;

    margin:5px;

}


/* ================= RESPONSIVE ================= */

@media(max-width:768px){

    .product-container{

        width:95%;

        padding:25px;

    }

    .navbar-brand{

        font-size:22px;

    }

}

</style>

</head>


<body>


<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-expand-sm py-3">

<div class="container-fluid fw-bolder fs-5">


<a class="navbar-brand" href="#">

<img src="logo image.png"
     alt="Logo"
     width="40"
     height="40"
     class="rounded-circle">

</a>


<a class="navbar-brand" href="#">

AUTOMART

</a>


<ul class="navbar-nav ms-auto">


<li class="nav-item">

<a class="nav-link" href="admin_home.jsp">

View Users

</a>

</li>


<li class="nav-item">

<a class="nav-link" href="view_products.jsp">

View Products

</a>

</li>


<li class="nav-item">

<a class="nav-link" href="addproduct.html">

Add Products

</a>

</li>


<li class="nav-item">

<a class="nav-link" href="about.html">

About

</a>

</li>


<li class="nav-item">

<a class="nav-link" href="login.html">

Logout

</a>

</li>


</ul>

</div>

</nav>



<!-- ================= ADD PRODUCT ================= -->

<div class="product-container">


<h1>🛒 Add Product</h1>

<p class="subtitle">

Add a new car, bike or automotive accessory to AUTOMART.

</p>


<form method="post"
      action="AddProductServlet"
      enctype="multipart/form-data">


<!-- Product Name -->

<div class="mb-3">

<label class="form-label">

Product Name

</label>

<input

type="text"

name="name"

class="form-control"

placeholder="Enter product name..."

required>

</div>



<!-- Description -->

<div class="mb-3">

<label class="form-label">

Description

</label>

<input

type="text"

name="description"

class="form-control"

placeholder="Enter product description..."

required>

</div>



<!-- Price -->

<div class="mb-3">

<label class="form-label">

Price (₹)

</label>

<input

type="text"

name="price"

class="form-control"

placeholder="Enter product price..."

required>

</div>



<!-- Image -->

<div class="mb-3">

<label class="form-label">

Product Image

</label>

<input

type="file"

name="image"

class="form-control"

accept="image/*"

required>

</div>



<!-- Submit -->

<input

type="submit"

value="➕ Add Product"

class="add-btn">


</form>


</div>



<!-- ================= FOOTER ================= -->

<div class="footer">

<h5>AUTOMART</h5>

<p>

🚗 Premium Cars &nbsp; • &nbsp;
🏍 Premium Bikes &nbsp; • &nbsp;
🛠 Automotive Accessories

</p>

<p>

© 2026 AUTOMART. All Rights Reserved.

</p>

</div>


</body>

</html>
