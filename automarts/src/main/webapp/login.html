<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AUTOMART | Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

background:linear-gradient(135deg,#ffffff,#f5f5f5,#ececec);
min-height:100vh;

}

/* Navbar */

.navbar{

background:#fff;
box-shadow:0 3px 15px rgba(0,0,0,.15);

}

.navbar-brand{

font-size:28px;
font-weight:bold;
color:#d60000!important;

}

.nav-link{

color:#333!important;
font-weight:bold;

}

.nav-link:hover{

color:#d60000!important;

}

/* Login Card */

.login-box{

width:420px;
margin:60px auto;
background:white;
padding:40px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.15);

}

.login-box h2{

text-align:center;
color:#d60000;
font-weight:bold;
margin-bottom:10px;

}

.login-box p{

text-align:center;
color:#666;
margin-bottom:30px;

}

.form-control{

height:50px;
border-radius:10px;

}

.form-control:focus{

border-color:#d60000;
box-shadow:0 0 8px rgba(214,0,0,.4);

}

.btn-login{

width:100%;
height:50px;
background:#d60000;
color:white;
font-size:18px;
font-weight:bold;
border:none;
border-radius:10px;
transition:.3s;

}

.btn-login:hover{

background:#b00000;

}

.footer{

background:#111;
color:white;
text-align:center;
padding:15px;
margin-top:60px;

}

</style>

</head>

<body>

<!-- Navbar -->

<nav class="navbar navbar-expand-sm py-3">

<div class="container">

<a class="navbar-brand" href="#">

<img src="logo image.png" width="40" class="rounded-circle">

AUTOMART

</a>

<ul class="navbar-nav ms-auto">

<li class="nav-item">

<a class="nav-link" href="about.html">About</a>

</li>

<li class="nav-item">

<a class="nav-link" href="contact.html">Contact</a>

</li>

</ul>

</div>

</nav>

<!-- Login Form -->

<div class="login-box">

<h2>Welcome Back</h2>

<p>Sign in to continue to <b>AUTOMART</b></p>

<form method="post" action="LoginServlet">

<div class="mb-3">

<label class="form-label">Username</label>

<input type="text"
class="form-control"
name="username"
placeholder="Enter your username"
required>

</div>

<div class="mb-4">

<label class="form-label">Password</label>

<input type="password"
class="form-control"
name="password"
placeholder="Enter your password"
required>

</div>

<input type="submit"
value="Login"
class="btn btn-login">

</form>

<div class="text-center mt-4">

<p>Don't have an account?
<a href="register.html"
style="color:#d60000;text-decoration:none;font-weight:bold;">
Register
</a>
</p>

</div>

</div>

<!-- Footer -->

<div class="footer">

© 2026 AUTOMART | Premium Cars • Bikes • Accessories

</div>

</body>
</html>
